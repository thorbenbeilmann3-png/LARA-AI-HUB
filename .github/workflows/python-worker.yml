name: Python control plane tests

on:
  push:
    branches:
      - feature/android-secure-api-key-storage
    paths:
      - "python-worker/**"
      - ".github/workflows/python-worker.yml"
  pull_request:
    paths:
      - "python-worker/**"
      - ".github/workflows/python-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-worker/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
