name: Node server tests

on:
  push:
    branches:
      - feature/android-secure-api-key-storage
    paths:
      - "index.js"
      - "tests/**"
      - "package.json"
      - ".github/workflows/node-server.yml"
  pull_request:
    paths:
      - "index.js"
      - "tests/**"
      - "package.json"
      - ".github/workflows/node-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
