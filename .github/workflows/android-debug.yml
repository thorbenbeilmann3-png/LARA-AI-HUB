name: Android debug APK

on:
  push:
    branches:
      - feature/android-secure-api-key-storage
  workflow_dispatch:

permissions:
  # write is needed only to publish the APK as a pre-release download
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install fixed signing key if configured
        env:
          LARA_CI_KEYSTORE_B64: ${{ secrets.LARA_CI_KEYSTORE_B64 }}
        run: sh tools/ci/install-signing-key.sh

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LARA-AI-HUB-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish as "neueste Version" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=lara-debug-latest
          cp app/build/outputs/apk/debug/app-debug.apk LARA-debug.apk
          SUM=$(sha256sum LARA-debug.apk | cut -d' ' -f1)
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" LARA-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "LARA Debug – neueste Version" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} @ ${GITHUB_SHA}. Debug-Version, nur fuer Tests. SHA-256: ${SUM}"

      - name: Remove signing key
        if: always()
        run: rm -f "${LARA_CI_KEYSTORE_PATH:-}"
