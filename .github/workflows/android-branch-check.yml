name: Android branch check

# Builds the Alpine work branches. Separate from "Android debug APK" so the fixed
# download lara-debug-latest is never replaced by a build that was not tested on the device.
on:
  push:
    branches:
      - "claude/alpine-**"
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Test build: other package name, so it installs next to an existing LARA.
      LARA_SIDE_BY_SIDE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Report unit test totals
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              root = ET.parse(path).getroot()
              counts = {key: int(root.get(key, 0)) for key in totals}
              print(root.get("name"), counts)
              for key, value in counts.items():
                  totals[key] += value
              for case in root.findall("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is not None:
                      text = (problem.get("message") or "").replace("\n", " ")[:300]
                      print(f"::error title=Unit test::{case.get('classname')}.{case.get('name')}: {text}")
          print(f"::notice title=Unit tests::{totals}")
          PY

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" > badging.txt
          grep -E "^package:|^application-label:|^uses-permission:|^sdkVersion|^targetSdkVersion" badging.txt
          grep -q "^package: name='de.laraai.hub.alpinetest'" badging.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-certs.txt
          CERT=$(grep -m1 "certificate SHA-256 digest" apk-certs.txt | awk '{print $NF}')
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "::notice title=APK::sha256=$SUM signing-cert-sha256=$CERT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LARA-alpine-test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    # Own job: the write permission never reaches the build steps or third-party actions there.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: LARA-alpine-test-debug

      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT=${GITHUB_SHA::7}
          NAME="LARA-Test-$SHORT.apk"
          cp app-debug.apk "$NAME"
          SUM=$(sha256sum "$NAME" | cut -d' ' -f1)
          gh release create "lara-alpine-test-$SHORT" "$NAME" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "LARA Test $SHORT (Entwurf, nicht öffentlich)" \
            --notes "Testbuild aus ${GITHUB_REF_NAME} @ ${GITHUB_SHA}. Paket de.laraai.hub.alpinetest, installiert sich neben einer vorhandenen LARA-App. SHA-256: ${SUM}. Kein Gerätetest durch CI."
